<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article>
        <div class="article-content">
          <!-- Article Illustration -->
          <img
            class="article-illustration"
            src="./assets/images/illustration-article.svg"
            alt=""
          />
          <p class="article-tag">Learning</p>
          <time class="article-date" datetime="2023-12-21"
            >Published 21 Dec 2023</time
          >
          <h1 class="article-title">
            <a href="">HTML & CSS foundations</a>
          </h1>
          <p class="article-desc">
            These languages are the backbone of every website, defining structure,
            content, and presentation.
          </p>
        </div>

        <!-- Author -->
        <div class="article-author">
          <img
            class="article-author__avatar"
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper avatar"
            width="32px"
            height="32px"
          />
          <p class="article-author__name">Greg Hooper</p>
        </div>
      </article>
    </main>
  </body>
</html>
